[plugin]

name="Mike's Game Bones"
description="A reusable, genre-agnostic gameplay framework for Godot 4: GameObject/ObjectDefinition (traits, capabilities, state), Actor (a presentation-neutral Node with 3D/2D presentation bodies), Controller (player/AI decision-making), and Action/ActionRunner/Rules/Authority (a request -> legality-check -> resolve -> result pipeline). Deliberately carries no game-specific rules, combat resolution, or UI -- those belong in the game that consumes this addon."
author="Michael Miller"
version="0.1.0"
script="plugin.gd"
